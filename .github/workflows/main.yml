name: Build Isolated Web App

on:
  push:
    branches: [ main ]

jobs:
  build-swbn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install wbn wbn-sign

      - name: Restore private key from GitHub Secrets
        run: echo "${{ secrets.IWA_PRIVATE_KEY }}" | base64 -d > private_key.pem

      - name: Verify key is valid and unencrypted
        run: |
          echo "--- OpenSSL validation ---"
          openssl pkey -in private_key.pem -noout -text

      - name: List files being bundled (sanity check)
        run: |
          echo "--- Files at bundle root (including hidden) ---"
          ls -la .
          echo "--- .well-known contents ---"
          ls -la .well-known || echo ".well-known folder not found!"

      - name: Build unsigned Web Bundle
        run: >
          npx wbn --dir ./
          --baseURL "isolated-app://aqt5mf6pzyjo4p462gwjt7q6xefz4nbolqt4ijl4q6f7utr74gpaaaic/"
          --output unsigned.wbn

      - name: Sign Web Bundle to create .swbn
        run: npx wbn-sign sign unsigned.wbn private_key.pem -o app.swbn

      - name: Upload Signed Web Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: isolated-web-app
          path: app.swbn
